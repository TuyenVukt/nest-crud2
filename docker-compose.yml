version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: postgres_db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog-dev-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs_api
    ports:
      - '3000:3000'
      - '5555:5555'  # nếu bạn dùng Prisma studio
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - uploads:/usr/src/app/uploads
      - post_cover:/usr/src/app/post-cover
    command: >
      sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  postgres_data:
  uploads:
  post_cover:
